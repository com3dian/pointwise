<script type="module">
const { snapPoint, routePoints, roundedPath, nearestOnLine, getBounds } = (() => {
/** Geometry for schematic metro routes. No DOM or framework dependencies. */
const EPSILON = 1e-8;
const distance = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
const isPoint = (point) => point && Number.isFinite(point.x) && Number.isFinite(point.y);
const samePoint = (a, b) => distance(a, b) < EPSILON;
const copyPoint = ({ x, y }) => ({ x, y });

/** Round a point to the nearest grid intersection. */
function snapPoint(point, grid = 20) {
  if (!isPoint(point)) return { x: 0, y: 0 };
  if (!Number.isFinite(grid) || grid <= 0) return copyPoint(point);
  return {
    x: Math.round(point.x / grid) * grid || 0,
    y: Math.round(point.y / grid) * grid || 0,
  };
}

/** Connect two locations using the requested schematic grid. */
function routePair(start, end, routing = 'octilinear') {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const diagonal = Math.min(Math.abs(dx), Math.abs(dy));
  const points = [copyPoint(start)];
  if (routing === 'orthogonal' && Math.abs(dx) > EPSILON && Math.abs(dy) > EPSILON) {
    points.push({ x: end.x, y: start.y });
  } else if (routing !== 'orthogonal' && diagonal > EPSILON && Math.abs(Math.abs(dx) - Math.abs(dy)) > EPSILON) {
    points.push({
      x: start.x + Math.sign(dx) * diagonal,
      y: start.y + Math.sign(dy) * diagonal,
    });
  }
  if (!samePoint(start, end)) points.push(copyPoint(end));
  return points;
}

/**
 * Return a polyline on a 45° grid, or use only horizontal/vertical legs when
 * routing is orthogonal. Orthogonal pairs travel horizontally first.
 * Inputs are not mutated, and every supplied valid location is preserved.
 */
function routePoints(nodes, routing = 'octilinear') {
  const valid = (nodes || []).filter(isPoint);
  if (!valid.length) return [];
  const points = [copyPoint(valid[0])];
  for (let index = 1; index < valid.length; index += 1) {
    for (const point of routePair(valid[index - 1], valid[index], routing).slice(1)) {
      if (!samePoint(points.at(-1), point)) points.push(point);
    }
  }
  return points;
}

const format = (number) => String(Number(number.toFixed(3)));
const coordinates = (point) => `${format(point.x)} ${format(point.y)}`;

/**
 * Make an SVG path with soft quadratic, circular, beveled or sharp corners.
 * Radius is the tangent cutback distance, capped at half of each neighboring
 * leg. Optional anchors cap the nearest corner midpoint's deviation so stops
 * remain on the route. A zero deviation keeps an interchange exactly fixed.
 */
function roundedPath(points, radius = 18, anchors = [], style = 'rounded') {
  const clean = (points || []).filter(isPoint).filter((point, index, all) =>
    index === 0 || !samePoint(point, all[index - 1]));
  if (!clean.length) return '';
  let path = `M ${coordinates(clean[0])}`;
  const cornerStyle = ['sharp', 'rounded', 'circular', 'bevel'].includes(style) ? style : 'rounded';
  const requestedRadius = cornerStyle !== 'sharp' && Number.isFinite(radius) ? Math.max(0, radius) : 0;
  const protectedCorners = (Array.isArray(anchors) ? anchors : [])
    .filter(anchor => isPoint(anchor) && Number.isFinite(anchor.maxDeviation));
  for (let index = 1; index < clean.length - 1; index += 1) {
    const previous = clean[index - 1];
    const corner = clean[index];
    const next = clean[index + 1];
    const previousLength = distance(previous, corner);
    const nextLength = distance(corner, next);
    const cross = (corner.x - previous.x) * (next.y - corner.y)
      - (corner.y - previous.y) * (next.x - corner.x);
    let cornerRadius = Math.min(requestedRadius, previousLength / 2, nextLength / 2);
    if (cornerRadius <= EPSILON || Math.abs(cross) < EPSILON) {
      path += ` L ${coordinates(corner)}`;
      continue;
    }
    const unitSum = Math.hypot(
      (previous.x - corner.x) / previousLength + (next.x - corner.x) / nextLength,
      (previous.y - corner.y) / previousLength + (next.y - corner.y) / nextLength,
    );
    const dot = ((corner.x - previous.x) * (next.x - corner.x)
      + (corner.y - previous.y) * (next.y - corner.y)) / (previousLength * nextLength);
    const turnAngle = Math.acos(Math.max(-1, Math.min(1, dot)));
    // Each shape's midpoint offset is linear in tangent cutback. These exact
    // factors let the same anchor limit apply without sampling SVG curves.
    const deviationPerUnit = cornerStyle === 'circular' ? Math.tan(turnAngle / 4)
      : cornerStyle === 'bevel' ? unitSum / 2 : unitSum / 4;
    for (const anchor of protectedCorners) {
      if (samePoint(corner, anchor) && deviationPerUnit > EPSILON) {
        cornerRadius = Math.min(cornerRadius, Math.max(0, anchor.maxDeviation) / deviationPerUnit);
      }
    }
    if (cornerRadius <= EPSILON) {
      path += ` L ${coordinates(corner)}`;
      continue;
    }
    const entry = {
      x: corner.x + (previous.x - corner.x) * cornerRadius / previousLength,
      y: corner.y + (previous.y - corner.y) * cornerRadius / previousLength,
    };
    const exit = {
      x: corner.x + (next.x - corner.x) * cornerRadius / nextLength,
      y: corner.y + (next.y - corner.y) * cornerRadius / nextLength,
    };
    path += ` L ${coordinates(entry)}`;
    if (cornerStyle === 'bevel') {
      path += ` L ${coordinates(exit)}`;
    } else if (cornerStyle === 'circular') {
      // A circle tangent to both legs has R = cutback / tan(turn/2).
      // SVG uses clockwise sweep in its downward-positive coordinate system.
      const circleRadius = cornerRadius / Math.tan(turnAngle / 2);
      if (Number.isFinite(circleRadius) && circleRadius >= 0.0005) {
        path += ` A ${format(circleRadius)} ${format(circleRadius)} 0 0 ${cross > 0 ? 1 : 0} ${coordinates(exit)}`;
      } else {
        path += ` L ${coordinates(exit)}`;
      }
    } else {
      path += ` Q ${coordinates(corner)} ${coordinates(exit)}`;
    }
  }
  if (clean.length > 1) path += ` L ${coordinates(clean.at(-1))}`;
  return path;
}

/** Closest position on a segment, including endpoints. */
function projectPoint(point, start, end) {
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const squaredLength = dx * dx + dy * dy;
  const t = squaredLength > EPSILON
    ? Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.y - start.y) * dy) / squaredLength))
    : 0;
  return { x: start.x + t * dx, y: start.y + t * dy };
}

/**
 * Find a stop insertion position on the routed polyline. insertIndex refers to
 * the ORIGINAL node array, even where a generated elbow is the nearest point.
 * Empty lines return the supplied point with distance Infinity and index 0.
 */
function nearestOnLine(point, nodes, routing = 'octilinear') {
  const target = isPoint(point) ? point : { x: 0, y: 0 };
  const valid = (nodes || []).map((node, index) => ({ node, index })).filter(({ node }) => isPoint(node));
  if (!valid.length) return { ...copyPoint(target), distance: Infinity, insertIndex: 0 };
  let nearest = {
    ...copyPoint(valid[0].node),
    distance: distance(target, valid[0].node),
    insertIndex: valid[0].index + 1,
  };
  for (let index = 1; index < valid.length; index += 1) {
    const routed = routePair(valid[index - 1].node, valid[index].node, routing);
    for (let segment = 1; segment < routed.length; segment += 1) {
      const position = projectPoint(target, routed[segment - 1], routed[segment]);
      const gap = distance(target, position);
      if (gap < nearest.distance) {
        nearest = { ...position, distance: gap, insertIndex: valid[index].index };
      }
    }
  }
  return nearest;
}

/** Bounding box with consistent padding, including useful empty/single cases. */
function getBounds(nodes, padding = 100) {
  const valid = (nodes || []).filter(isPoint);
  const pad = Number.isFinite(padding) ? Math.max(0, padding) : 100;
  const xs = valid.map((point) => point.x);
  const ys = valid.map((point) => point.y);
  const minX = valid.length ? Math.min(...xs) : 0;
  const minY = valid.length ? Math.min(...ys) : 0;
  const maxX = valid.length ? Math.max(...xs) : 0;
  const maxY = valid.length ? Math.max(...ys) : 0;
  return {
    x: minX - pad,
    y: minY - pad,
    width: Math.max(1, maxX - minX + pad * 2),
    height: Math.max(1, maxY - minY + pad * 2),
  };
}

return { snapPoint, routePoints, roundedPath, nearestOnLine, getBounds };
})();
const { SYMBOL_TYPES, normalizeSymbol, normalizeSymbolColors, renderStationSymbol, symbolExtent, normalizeCrossArms, resolveCrossArms } = (() => {
/** Shared station glyphs for the editor, picker, and exported SVG drawing. */
const SYMBOL_TYPES = [
  { id: 'auto', label: 'Automatic', description: 'A simple stop; shared stops become larger interchange circles.' },
  { id: 'circle', label: 'Circle', description: 'A classic hollow station circle.' },
  { id: 'disc', label: 'Filled dot', description: 'A route-colored dot with an outlined edge.' },
  { id: 'capsule', label: 'Capsule', description: 'One continuous, rounded interchange marker.' },
  { id: 'open-capsule', label: 'Open capsule', description: 'A transparent capsule that reveals the routes beneath it.' },
  { id: 'pill-dots', label: 'Capsule with dots', description: 'A capsule containing a colored dot for each connected route.' },
  { id: 'linked', label: 'Linked circles', description: 'Two hollow circles joined by a narrow, outlined bridge.' },
  { id: 'linked-dots', label: 'Linked route dots', description: 'Linked circles with different route colors inside them.' },
  { id: 'double-circle', label: 'Touching circles', description: 'A pair of touching circular markers with colored centers.' },
  { id: 'cross', label: 'Cross', description: 'A connected marker whose arms follow crossing routes or your own angles.' },
  { id: 'segmented-ring', label: 'Segmented ring', description: 'An open ring divided into the connected route colors.' },
  { id: 'orbital', label: 'Orbital ring', description: 'An interchange ring with two small connection circles.' },
];

const shapes = new Set(SYMBOL_TYPES.map(type => type.id));
const finite = (value, fallback, min, max) => Number.isFinite(value)
  ? Math.max(min, Math.min(max, value)) : fallback;
const number = value => String(Number(value.toFixed(3)));
const color = (value, fallback) => typeof value === 'string' && /^(?:#[0-9a-f]{3}|#[0-9a-f]{6}|#[0-9a-f]{8})$/i.test(value) ? value : fallback;

/** Normalize optional appearance fields without altering old saved maps. */
function normalizeSymbol(node = {}) {
  return {
    shape: shapes.has(node.symbol) ? node.symbol : 'auto',
    angle: finite(node.symbolAngle, 0, -180, 180),
    size: finite(node.symbolSize, 1, 0.6, 3),
    length: finite(node.symbolLength, 28, 12, 60),
    outline: ['line','custom'].includes(node.symbolOutline) ? node.symbolOutline : 'ink',
    fill: ['transparent','custom'].includes(node.symbolFill) ? node.symbolFill : 'paper',
  };
}

function normalizeSymbolColors(node={}) {
  const hex=(value,fallback)=>typeof value==='string'&&/^#[0-9a-f]{6}$/i.test(value)?value:fallback;
  return {outlineColor:hex(node.symbolOutlineColor,'#344038'),fillColor:hex(node.symbolFillColor,'#ffffff')};
}

const defaultCrossArms = (length = 18) => [0, 90, 180, -90].map(angle => ({ angle, length }));
const wrapAngle = angle => ((angle + 180) % 360 + 360) % 360 - 180;

/** Normalize editable arm values without changing their order in the inspector. */
function normalizeCrossArms(arms) {
  if (!Array.isArray(arms)) return defaultCrossArms();
  const clean = arms.slice(0, 8).filter(arm => arm && Number.isFinite(arm.angle)).map(arm => ({
    angle: finite(arm.angle, 0, -180, 180),
    length: finite(arm.length, 18, 6, 60),
  }));
  return clean.length ? clean : defaultCrossArms();
}

/** Resolve inferred route directions or the saved custom arm configuration. */
function resolveCrossArms(node = {}, directions = []) {
  const defaultLength = normalizeSymbol(node).length / 2 + 4;
  const inferred = Array.isArray(directions)
    ? directions.filter(arm => arm && Number.isFinite(arm.angle)).slice(0, 8).map(arm => ({
      angle: wrapAngle(arm.angle), length: finite(arm.length, defaultLength, 6, 60),
    })) : [];
  const chosen = node.symbolCrossMode === 'manual'
    ? normalizeCrossArms(node.symbolCrossArms)
    : inferred.length ? inferred : defaultCrossArms(defaultLength);
  // Coincident rays represent one arm, not overlapping glyphs. Taking the
  // longest also keeps nearly parallel user edits finite and predictable.
  const merged = [];
  for (const arm of chosen) {
    const existing = merged.find(other => Math.abs(wrapAngle(other.angle - arm.angle)) < 0.01);
    if (existing) existing.length = Math.max(existing.length, arm.length);
    else merged.push({ ...arm });
  }
  return merged;
}

/**
 * A conservative radius around the full symbol, safe at every orientation.
 * The app uses this for hit targets, label clearance, and SVG export bounds.
 */
function symbolExtent(node = {}, interchange = false, directions = []) {
  const symbol = normalizeSymbol(node);
  const half = symbol.length / 2;
  const armHalfWidth = finite(node.symbolArmWidth, 10, 6, 24) / 2;
  let extent;
  switch (symbol.shape) {
    case 'auto': extent = interchange ? 11 : 8; break;
    case 'circle': case 'disc': extent = 10; break;
    case 'capsule': case 'open-capsule': case 'pill-dots':
      extent = Math.hypot(half + 11, 11); break;
    case 'linked': case 'linked-dots': extent = half + 10; break;
    case 'double-circle': extent = symbol.length + 2; break;
    case 'cross': extent = Math.hypot(Math.max(...resolveCrossArms(node, directions).map(arm => arm.length)), armHalfWidth) + (node.symbolCornerStyle === 'sharp' ? 3 : 2); break;
    case 'segmented-ring': extent = 17; break;
    case 'orbital': extent = 23; break;
    default: extent = 11;
  }
  return extent * symbol.size;
}

const crossProduct = (a, b) => a.x * b.y - a.y * b.x;
const subtract = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });

/** Segment intersection; parallel overlap vertices already exist in the input. */
function segmentIntersection(a, b, c, d) {
  const r = subtract(b, a), s = subtract(d, c), denominator = crossProduct(r, s);
  if (Math.abs(denominator) < 1e-9) return null;
  const offset = subtract(c, a);
  const t = crossProduct(offset, s) / denominator;
  const u = crossProduct(offset, r) / denominator;
  if (t < -1e-8 || t > 1 + 1e-8 || u < -1e-8 || u > 1 + 1e-8) return null;
  return { x: a.x + t * r.x, y: a.y + t * r.y };
}

/**
 * Union ray strips into one closed silhouette. Each rectangle and the central
 * disk contains the origin, so their union is star-shaped and has no holes.
 * Polygon vertices and edge intersections are the only possible changes of
 * boundary edge; at each of their angles, keep the outermost ray intersection.
 * This avoids the interior borders that overlapping stroked arms would create.
 */
function crossSilhouette(arms, halfWidth = 5) {
  const polygons = arms.map(arm => {
    const angle = arm.angle * Math.PI / 180;
    const u = { x: Math.cos(angle), y: Math.sin(angle) };
    const n = { x: -u.y * halfWidth, y: u.x * halfWidth };
    const end = { x: u.x * arm.length, y: u.y * arm.length };
    return [n, { x: end.x + n.x, y: end.y + n.y }, { x: end.x - n.x, y: end.y - n.y }, { x: -n.x, y: -n.y }];
  });
  // A small round hub makes even a single branch, a T-junction, or a cluster
  // of closely spaced branches one connected, well-defined polygon.
  polygons.push(Array.from({ length: 16 }, (_, i) => ({
    x: Math.cos(i * Math.PI / 8) * halfWidth,
    y: Math.sin(i * Math.PI / 8) * halfWidth,
  })));
  const edges = polygons.flatMap(points => points.map((start, i) => [start, points[(i + 1) % points.length]]));
  const candidates = polygons.flat();
  for (let i = 0; i < edges.length; i += 1) {
    for (let j = i + 1; j < edges.length; j += 1) {
      const crossing = segmentIntersection(...edges[i], ...edges[j]);
      if (crossing && Math.hypot(crossing.x, crossing.y) > 1e-8) candidates.push(crossing);
    }
  }
  const angles = [...new Set(candidates.filter(p => Math.hypot(p.x, p.y) > 1e-8)
    .map(p => Number(Math.atan2(p.y, p.x).toFixed(10))))].sort((a, b) => a - b);
  const boundary = angles.map(angle => {
    const ray = { x: Math.cos(angle), y: Math.sin(angle) };
    let length = halfWidth;
    for (const [a, b] of edges) {
      const edge = subtract(b, a), denominator = crossProduct(ray, edge);
      if (Math.abs(denominator) < 1e-9) continue;
      const distance = crossProduct(a, edge) / denominator;
      const t = crossProduct(a, ray) / denominator;
      if (distance >= 0 && t >= -1e-8 && t <= 1 + 1e-8) length = Math.max(length, distance);
    }
    return { x: ray.x * length, y: ray.y * length };
  }).filter((point, i, all) => i === 0 || Math.hypot(point.x - all[i - 1].x, point.y - all[i - 1].y) > 1e-5);
  return boundary.map((point, i) => `${i ? 'L' : 'M'} ${number(point.x)} ${number(point.y)}`).join(' ') + ' Z';
}

function arc(radius, start, end) {
  const a = start * Math.PI / 180, b = end * Math.PI / 180;
  return `M ${number(radius * Math.cos(a))} ${number(radius * Math.sin(a))} A ${radius} ${radius} 0 ${end - start > 180 ? 1 : 0} 1 ${number(radius * Math.cos(b))} ${number(radius * Math.sin(b))}`;
}

/**
 * Render one self-contained SVG symbol; all input used in markup is normalized.
 * Elongated symbols lie on the local X axis. Rotate 90° for a vertical marker.
 */
function renderStationSymbol(node = {}, options = {}) {
  const symbol = normalizeSymbol(node);
  const ink = color(options.ink, '#344038');
  const paper = color(options.paper, '#f8f9f5');
  const supplied = Array.isArray(options.colors) ? options.colors : ['#4068e8'];
  const colors = supplied.length ? supplied.map(value => color(value, '#4068e8')) : ['#4068e8'];
  const first = colors[0], second = colors[1] || first;
  const interchange = options.interchange === true;
  const paints=normalizeSymbolColors(node);
  const outline = symbol.outline === 'custom' ? paints.outlineColor : symbol.outline === 'line' ? first : symbol.shape === 'auto'
    ? interchange ? ink : first
    : ink;
  const fill = symbol.fill === 'custom' ? paints.fillColor : symbol.fill === 'transparent' ? 'none' : paper;
  const x = finite(node.x, 0, -100000, 100000), y = finite(node.y, 0, -100000, 100000);
  const half = symbol.length / 2;
  const circle = (cx, cy, radius, inside = fill, edge = outline, width = 3) =>
    `<circle cx="${number(cx)}" cy="${number(cy)}" r="${number(radius)}" fill="${inside}" stroke="${edge}" stroke-width="${width}"/>`;
  const pill = (inside = fill, edge = outline, width = 3) =>
    `<rect x="${number(-half - 7.5)}" y="-7.5" width="${number(symbol.length + 15)}" height="15" rx="7.5" fill="${inside}" stroke="${edge}" stroke-width="${width}"/>`;
  let body = '';
  let crossMetadata = '';
  switch (symbol.shape) {
    case 'auto': body = circle(0, 0, interchange ? 9 : 6); break;
    case 'circle': body = circle(0, 0, 8); break;
    case 'disc': body = circle(0, 0, 8, first); break;
    case 'capsule': body = pill(); break;

  });

  if(action==='all-crosses-global')commit(()=>map.nodes.filter(n=>n.symbol==='cross').forEach(n=>n.crossStyleMode='global'));

function editCrossArm(e) {
  const target=e.target,n=selectedNode(),index=Number(target.dataset.crossIndex),key=target.dataset.crossField;
  if(!n||n.symbol!=='cross'||n.symbolCrossMode!=='manual'||target.value===''||!target.validity.valid)return;

  arms[index][key]=value;n.symbolCrossArms=normalizeCrossArms(arms);save();render(false);
}
function editDefaultField(e) {
  const target=e.target,key=target.dataset.defaultField;
  if(target.type==='number'&&(target.value===''||!target.validity.valid))return;
  if((/Color$/.test(key)||key==='color')&&!/^#[0-9a-fA-F]{6}$/.test(target.value))return;
  const numeric=['cornerRadius','width','crossSize','crossLength','crossWidth','labelFontSize','labelWeight','labelAngle','labelGap'].includes(key),value=key==='labelFromStop'?target.value==='true':numeric?Number(target.value):target.value;
  const current=normalizeDefaults(map.defaults);if(current[key]===value&&!((key==='crossOutlineColor'&&current.crossOutline!=='custom')||(key==='crossFillColor'&&current.crossFill!=='custom')))return;
  if(!editingField||editingField.target!==target)editingField={target,changed:false};
  if(!editingField.changed){snapshot();editingField.changed=true;}
  const changes={[key]:value};
  if(key==='crossOutlineColor')changes.crossOutline='custom';
  if(key==='crossFillColor')changes.crossFill='custom';
  map.defaults=normalizeDefaults({...current,...changes});save();render();
  $$('#modal [data-value-for]').filter(el=>el.dataset.valueFor===key).forEach(el=>el.textContent=formatControlValue(key,map.defaults[key]));
}
function editField(e){
  if(e.target.dataset.defaultField){editDefaultField(e);return;}
  if(e.target.dataset.crossField){editCrossArm(e);return;}
  const target=e.target, nodeKey=target.dataset.nodeField, lineKey=target.dataset.lineField;
  const record=nodeKey?selectedNode():lineKey?selectedLine():null,key=nodeKey||lineKey;
  if(!record)return;
  if(target.type==='number'&&(target.value===''||!target.validity.valid))return;
  if((/Color$/.test(key)||key==='color')&&!/^#[0-9a-fA-F]{6}$/.test(target.value))return;
  const value=key==='labelFromStop'?target.value==='true':['labelFontSize','labelWeight','labelGap','labelOffsetX','labelOffsetY','labelAngle','width','cornerRadius','symbolAngle','symbolSize','symbolLength','symbolArmWidth'].includes(key)?Number(target.value):target.value;
  const localLine=lineKey&&lineVisualKeys.includes(key),localCross=nodeKey&&record.symbol==='cross'&&crossVisualKeys.includes(key);
  const localText=nodeKey&&textStyleKeys.includes(key);
  const current=localText?effectiveLabel(map,record):localLine?effectiveLine(map,record):localCross?effectiveNode(map,record):record;
  if(current[key]===value&&!((key==='symbolOutlineColor'&&current.symbolOutline!=='custom')||(key==='symbolFillColor'&&current.symbolFill!=='custom')))return;
  if(!editingField||editingField.target!==target)editingField={target,changed:false};
  if(!editingField.changed){snapshot();editingField.changed=true;}
  if(localText)makeTextCustom(record);
  if(localLine)makeLineCustom(record);
  if(localCross)makeCrossCustom(record);
  if(key==='symbolCrossMode'&&value==='manual')record.symbolCrossArms=resolveCrossArms(effectiveNode(map,record),stationDirections(map,record.id));
  if(key==='labelPosition'&&effectiveLabel(map,record).labelFromStop){makeTextCustom(record);record.labelFromStop=false;}
  if(key==='symbolOutlineColor'){record.symbolOutline='custom';const source=$('[data-node-field="symbolOutline"]');if(source)source.value='custom';}
  if(key==='symbolFillColor'){record.symbolFill='custom';const source=$('[data-node-field="symbolFill"]');if(source)source.value='custom';}
  record[key]=value;save();render(['symbolCrossMode','labelPosition','symbolOutline','symbolFill'].includes(key));
  $$('[data-node-field]').filter(el=>el!==target&&el.dataset.nodeField===key).forEach(el=>el.value=value);
  $$('[data-value-for]').filter(el=>el.dataset.valueFor===key).forEach(el=>el.textContent=formatControlValue(key,value));
  const preview=$(`[data-paint-preview="${nodeKey?'node':'line'}-${key}"]`);if(preview)preview.style.setProperty('--paint-color',value);
  if(localText&&$('#inherit-text'))$('#inherit-text').checked=false;
  if(key==='labelColor')$$('[data-reset-text-color="node"]').forEach(el=>{el.classList.remove('active');el.setAttribute('aria-pressed','false');});
  if(localLine&&$('#inherit-line')){$('#inherit-line').checked=false;$('#line-style-status').textContent='Custom style for this line.';}
  if(localCross&&$('#inherit-cross')){$('#inherit-cross').checked=false;$('#cross-style-status').textContent='Custom appearance for this cross.';}
  if(key==='cornerRadius')$$('[data-corner-radius]').forEach(el=>el.classList.toggle('active',Number(el.dataset.cornerRadius)===value));
  if(key==='symbolAngle')$$('[data-symbol-angle]').forEach(el=>el.classList.toggle('active',Number(el.dataset.symbolAngle)===value));
}

document.addEventListener('keydown',e=>{
  if(e.defaultPrevented)return;
  if(e.key==='Escape'&&paletteTarget){e.preventDefault();closeColorPalette();return;}
  if(e.target.closest('input,textarea,select,[contenteditable]')||$('#modal').open)return;
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();if(!presenting)history(e.shiftKey?'redo':'undo');return;}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();void saveProject();return;}
  if(e.key==='Escape'&&drag?.type==='label'){e.preventDefault();map=drag.before;drag=null;render();return;}
  if(e.key==='Escape'&&drag?.type==='route-point'){e.preventDefault();cancelRoutePointDrag();return;}
  if(e.key==='Escape'){if(presenting)setPresent(false);else {finishLine(false);setTool('select');setSelection(null);}return;}
  if(presenting)return;
  if(e.code==='Space'){if(e.target.closest('button,a,summary'))return;e.preventDefault();spaceDown=true;canvas.style.cursor='grab';return;}
  if(mod)return;
  if(e.key==='\\'){e.preventDefault();toggleFocus();return;}
  if(e.key==='['){e.preventDefault();togglePanel('left');return;}
  if(e.key===']'){e.preventDefault();togglePanel('right');return;}
  const key=e.key.toLowerCase();
  if(key==='v')setTool('select');if(key==='h')setTool('hand');if(key==='s')setTool('stop');if(key==='l'&&!drawing)createLine();if(key==='f')fitMap();
  if(key==='enter'&&drawing)finishLine();
  if(key==='delete'||key==='backspace'){e.preventDefault();if(!removeActiveRoutePoint())removeSelection();}

$('#help').onclick=()=>openModal(`${modalHead('Help & shortcuts')}<p class="modal-intro">Draw a line by clicking to place stops. The route automatically follows metro-style angles. Click an existing stop to connect lines; drag one stop onto another to merge them.</p><div class="shortcut-list">${[['Select & move','V'],['New line','L'],['Insert a stop','S'],['Pan the canvas','H / Space'],['Finish a line','Enter'],['Place a route bend','Shift + click'],['Fit the whole map','F'],['Lines panel','['],['Properties panel',']'],['Fullscreen','\\'],['Undo / redo','⌘Z / ⌘⇧Z'],['Remove selection','Delete'],['Cancel / exit','Esc']].map(([t,k])=>`<div class="shortcut-item"><span>${t}</span><kbd>${k}</kbd></div>`).join('')}</div><div class="onboard-note">Drag a selected line’s diamond handles, or drag any segment, to reshape the route locally. Double-click a bend to remove it; double-click the route itself to insert a station. Use <strong>Continue this line</strong> to extend a selected route. In presentation mode, clicking a station opens its story. Your map is saved on this browser; export JSON to back it up or continue on another device.</div>`);
$('#export').onclick=()=>openModal(`${modalHead('Export map')}<p class="modal-intro">Take your map with you. Export a crisp vector graphic or save an editable copy of the whole network.</p><div class="export-options"><button class="export-option" data-action="export-svg">${icon('export')}<strong>Export SVG</strong><p>A sharp, scalable map for documents, slides, and print.</p><span class="keycap">VECTOR IMAGE</span></button><button class="export-option" data-action="export-json">${icon('file')}<strong>Save map file</strong><p>Keep all your lines, stops, and stories. Reopen it in Pointwise.</p><span class="keycap">EDITABLE JSON</span></button></div><div class="modal-footer">Bring a saved map back into the studio.<button class="button outlined" data-action="import">Import JSON</button></div>`);

function disconnectProjectFile(){fileSessionRevision++;projectAutosave.detach();}
function fileDescription(status={state:projectAutosave.state}) {
  if(!nativeFileAccess)return 'This browser saves a recovery copy locally. Direct JSON autosave requires a browser with file-picker support, such as Chrome or Edge.';
  const messages={browser:'Open a JSON file or use Save as to enable file autosave.',pending:'Changes waiting to save…',saving:'Saving to JSON…',saved:'Autosaving to JSON',permission:'File autosave paused — reconnect to allow writing.',error:projectAutosave.error?.message||'File autosave paused. Your browser recovery copy is still available.'};
  return messages[status.state]||messages.browser;
}
function updateProjectFileStatus(status) {
  const button=$('#project-file');if(!button)return;
  button.title=fileDescription(status);button.dataset.saveState=status.state;
  const description=$('#project-file-description');if(description)description.textContent=fileDescription(status);
  const name=$('#project-file-name');if(name)name.textContent=projectAutosave.handle?.name||'No linked JSON file';
  const resume=$('[data-action="resume-file"]');if(resume)resume.hidden=!projectAutosave.handle||!projectAutosave.paused;
  const detach=$('[data-action="disconnect-file"]');if(detach)detach.hidden=!projectAutosave.handle;

$('#project-file').onclick=()=>{
  openModal(`${modalHead('Project file')}<p id="project-file-name" class="project-file-name"></p><p id="project-file-description" class="modal-intro" role="status"></p><div class="project-file-actions"><button class="button outlined" data-action="import">${icon('file')} Open JSON</button><button class="button primary" data-action="save-project" ${nativeFileAccess?'':'hidden'}>Save</button><button class="button outlined" data-action="save-project-as">${nativeFileAccess?'Save as…':'Download JSON'}</button><button class="button outlined" data-action="resume-file" hidden>Reconnect file</button><button class="button quiet" data-action="download-json" ${nativeFileAccess?'':'hidden'}>Download a copy</button><button class="button quiet" data-action="disconnect-file" hidden>Disconnect file</button></div>`);
  updateProjectFileStatus({state:projectAutosave.state||'browser'});

const jsonPickerOptions={types:[{description:'Pointwise project',accept:{'application/json':['.json']}}]};
async function readProjectFile(file){
  if(file.size>5*1024*1024)throw new Error('Choose a map file smaller than 5 MB.');
  const text=await file.text();return {text,next:validateMap(JSON.parse(text))};
}
function installProject(next){
  disconnectProjectFile();
  commit(()=>{map=next;selection=null;drawing=false;activeLineId=null;});
  undoStack=[];redoStack=[];setTool('select');render();$('#modal').close();fitMap();
}
async function openProjectJSON(){
  if(!nativeFileAccess){$('#import-file').click();return;}
  try{
    const [handle]=await window.showOpenFilePicker({...jsonPickerOptions,multiple:false});
    const granted=await handle.requestPermission({mode:'readwrite'})==='granted';
    const {text,next}=await readProjectFile(await handle.getFile());
    installProject(next);fileSessionRevision++;
    projectAutosave.attach(handle,{diskText:text,granted});
    notify(granted?'JSON opened. Edits will autosave to this file.':'JSON opened. Reconnect the file to enable autosave.');
  }catch(error){if(error.name!=='AbortError')notify(error instanceof SyntaxError?'This is not a valid JSON map.':error.message);}
}
async function saveProjectAs(){
  if(!nativeFileAccess){downloadJSON();return;}
  try{
    const handle=await window.showSaveFilePicker({...jsonPickerOptions,suggestedName:filename('json')});
    await projectAutosave.flush();
    const text=await (await handle.getFile()).text();
    fileSessionRevision++;
    projectAutosave.attach(handle,{diskText:text,savedText:null,granted:true});
    const success=await projectAutosave.flush();
    if(success){$('#modal').close();notify('Project saved. Edits will autosave to this JSON file.');}
    else notify(fileDescription({state:projectAutosave.state}));
  }catch(error){if(error.name!=='AbortError')notify(error.message);}
}
async function saveProject(){
  save();
  if(!projectAutosave.handle){await saveProjectAs();return;}
  const success=projectAutosave.paused?await projectAutosave.resume():await projectAutosave.flush();
  if(success){notify('JSON file saved.');$('#modal').close();}
  else notify(fileDescription({state:projectAutosave.state}));
}

async function restoreProjectFile(){
  if(!nativeFileAccess){updateProjectFileStatus({state:'browser'});return;}
  if(!loadedSavedMap){rememberProjectFile(null).catch(()=>{});return;}
  const revision=fileSessionRevision;
  try{
    const record=await recallProjectFile();if(!record?.handle||revision!==fileSessionRevision)return;
    const granted=await record.handle.queryPermission({mode:'readwrite'})==='granted';
    if(revision!==fileSessionRevision)return;
    projectAutosave.attach(record.handle,{diskText:record.diskText,savedText:record.savedText,granted});
  }catch{updateProjectFileStatus({state:'browser'});}
}

let resizeTimer;
new ResizeObserver(()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    const next={width:canvas.clientWidth,height:canvas.clientHeight};
    if(!next.width||!next.height)return;
    if(lastCanvasSize.width && (next.width!==lastCanvasSize.width||next.height!==lastCanvasSize.height)) {
      const unitsPerPixel=view.width/lastCanvasSize.width;
      const width=next.width*unitsPerPixel,height=next.height*unitsPerPixel;
      fitWidth*=next.width/lastCanvasSize.width;
      applyView({x:view.x+(view.width-width)/2,y:view.y+(view.height-height)/2,width,height});
    }
    lastCanvasSize=next;
  },60);
}).observe(canvasArea);
